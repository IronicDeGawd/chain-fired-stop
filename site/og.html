<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card source</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html,body{margin:0;background:#f6f5f1}
  .card{width:1200px;height:630px;position:relative;overflow:hidden;background:#f6f5f1;color:#1b1b18;
        font-family:'IBM Plex Sans',system-ui,sans-serif;padding:60px 68px;box-sizing:border-box}
  .in{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:18px;color:#6b685e;letter-spacing:.05em;text-transform:uppercase}
  h1{font-size:58px;font-weight:600;line-height:1.08;margin:16px 0 0;letter-spacing:-.015em;max-width:1010px}
  h1 em{font-style:normal;color:#1f4fd1}
  .row{display:flex;gap:14px}
  .stat{flex:1;background:#fff;border:1px solid #d9d6cc;border-radius:10px;padding:16px 20px}
  .stat b{display:block;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:34px;margin-bottom:4px}
  .stat.chain b{color:#1f4fd1} .stat.bot b{color:#9a3412}
  .stat span{color:#5c594f;font-size:16px}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;color:#6b685e;font-size:20px;border-top:1px solid #d9d6cc;padding-top:18px}
  .foot b{color:#1b1b18;font-weight:600}
</style>
</head>
<body>
<div class="card"><div class="in">
  <div>
    <div class="eyebrow">Who closed the position? · Somnia Tokyo testnet</div>
    <h1>My bot held the stop-loss and went offline. <em>The chain sold by itself.</em></h1>
  </div>
  <div class="row">
    <div class="stat bot"><b>162 s</b><span>the bot's stop was down</span></div>
    <div class="stat chain"><b>5 s</b><span>the chain checks the stop</span></div>
    <div class="stat chain"><b>0</b><span>signatures on the chain's sale</span></div>
  </div>
  <div class="foot"><span>chain-stop.ironyaditya.xyz</span><span><b>@0xironyAditya</b></span></div>
</div></div>
</body>
</html>
